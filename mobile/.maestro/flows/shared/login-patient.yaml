# Shared: Login as Patient Helper
# This flow can be called from other flows using runFlow

appId: com.chemocare.mobile

---

- waitForAnimationToEnd

# Check if already logged in
- runFlow:
    when:
      visible: "Sign In"
    commands:
      - tapOn:
          id: "email-input"
      - inputText: "patient@chemocare.com"
      - tapOn:
          id: "password-input"
      - inputText: "password123"
      - tapOn: "Sign In"
      - waitForAnimationToEnd:
          timeout: 5000
