[pytest]
# Pytest configuration for ChemoCare Backend

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require database)
    e2e: End-to-end tests (full stack)
    slow: Slow running tests

# Output settings
addopts = 
    -v
    --strict-markers
    --tb=short
    -ra

# Coverage settings (when using pytest-cov)
# Run with: pytest --cov=app --cov-report=html

# Logging
log_cli = true
log_cli_level = INFO

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
